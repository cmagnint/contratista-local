<div class="admin-perfiles-container" (click)="deseleccionarFila($event)">

    <div id="modalmodificarArea" class="modal-perfiles" *ngIf="modals['modificarSalud']">
          <div class="modal-content">
              <div class="modal-header">
                  <span class="close" (click)="closeModal('modificarSalud')">&times;</span>
                  <div class="header-bar"></div>
                  <div class="title-container">
                    <h2>Modificar Salud</h2>
                </div>
              </div>
              
              <div class="form-simple">
                  <h3>Código Previred:</h3>
                  <input type="number" class="input-perfil" [value]="saludSeleccionada.id_salud_seleccionada" readonly><br>
                  
                  <h3>Nombre:</h3>
                  <input type="text" class="input-perfil" [value]="saludSeleccionada.nombre_salud_seleccionada" readonly><br>
                  
                  <h3>Porcentaje de Descuento (%):</h3>
                  <input type="number" class="input-perfil" 
                         [(ngModel)]="porcentajeNew" min="0" max="100" step="0.1"><br>
              </div>
              
              <button class="custom-button" (click)="modificarSalud()">
                Modificar Salud
              </button>
          </div>
    </div>
        
    <button mat-raised-button color="primary" 
            class="custom-button"
            [disabled]="selectedRows.length !== 1" 
            (click)="openModal('modificarSalud')">
        Modificar Porcentaje
    </button>
        
    <table mat-table [dataSource]="saludCargadas" class="mat-elevation-z8" (click)="$event.stopPropagation()">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="mat-header">Código</th>
            <td mat-cell *matCellDef="let salud" class="mat-cell">{{ salud.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef class="mat-header">Nombre</th>
            <td mat-cell *matCellDef="let salud" class="mat-cell">{{ salud.nombre }}</td>
        </ng-container>
        
        <ng-container matColumnDef="porcentaje">
            <th mat-header-cell *matHeaderCellDef class="mat-header">Porcentaje (%)</th>
            <td mat-cell *matCellDef="let salud" class="mat-cell">{{ salud.porcentaje }}%</td>
        </ng-container>
              
        <tr mat-header-row *matHeaderRowDef="columnasDesplegadas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnasDesplegadas;" 
            [class.selected]="isSelected(row)" (click)="selectRow(row)"></tr>
    </table>
    
</div>

<!-- Modales de éxito y error -->
<div id="exitoModal" class="modal-perfiles" *ngIf="modals['exitoModal']">
        <div class="modal-content">
            <h2 style="color:white;">¡Éxito!</h2>
            <div class="exito-message" id="exitoText">Porcentaje actualizado correctamente</div>
            <button class="custom-button" (click)="closeModal('exitoModal')" >Cerrar</button>
        </div>
</div>
      
<div id="errorModal" class="modal-perfiles" *ngIf="modals['errorModal']">
        <div class="modal-content">
            <h2 style="color:white;">¡Error!</h2>
            <div class="error-icon-container">
                <i class="fas fa-exclamation-triangle icon-exclamation-triangle"></i>
            </div>
            <div class="error-message" style="color:white;">{{ errorMessage }}</div>
            <button class="custom-button" (click)="closeModal('errorModal')">Cerrar</button>
        </div>
</div>
